<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06110d">
<title>Wingo Image Studio</title>
<style>
:root{--bg:#050d0b;--panel:#0b1915;--line:#174b37;--green:#24f36b;--gold:#ffc42e;--muted:#9cb8aa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#12432c 0%,#07130e 43%,#030807 100%);color:#f4fff8;font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}.head{text-align:center;margin-bottom:25px}.brand{font-size:clamp(32px,6vw,54px);font-weight:1000;letter-spacing:2px;background:linear-gradient(#fff,#d7e7e0 45%,#ffc83d 80%);-webkit-background-clip:text;color:transparent;text-shadow:0 0 24px #00d66a55}.sub{color:#9eb8aa;margin-top:3px}
.layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;align-items:start}.panel{background:linear-gradient(145deg,#0d2119ee,#07110e);border:1px solid #1d6948;border-radius:22px;box-shadow:0 12px 45px #0009,inset 0 0 24px #00c85b0b;overflow:hidden}.panel h2{font-size:19px;margin:0;padding:19px 21px;border-bottom:1px solid #17432f}.controls{padding:20px;display:grid;gap:17px}.field label{display:block;font-weight:750;margin-bottom:8px}.field input,.field select{width:100%;background:#07130f;border:1px solid #315848;border-radius:12px;padding:14px;color:white;font-size:17px;outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #24f36b22}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{padding:13px;border:1px solid #47665a;border-radius:12px;background:#101f1a;color:white;font-weight:900;font-size:17px;cursor:pointer}.choice.active{background:linear-gradient(#20e85d,#087a31);border:2px solid #8dff9c;box-shadow:0 0 18px #18e85b88}.themes{display:flex;gap:11px;flex-wrap:wrap}.swatch{width:38px;height:38px;border-radius:11px;border:2px solid #ffffff66;cursor:pointer}.swatch.active{outline:2px solid white;outline-offset:3px}.generate,.action{border:0;border-radius:13px;padding:15px 18px;font-size:16px;font-weight:900;cursor:pointer;color:#07110b}.generate{background:linear-gradient(#ffe47b,#e99a00);box-shadow:0 0 22px #ffb40055;margin-top:5px}.preview{padding:18px}.previewtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.status{color:#70ff98;font-size:13px;font-weight:800}.canvasbox{background:#020706;border:1px solid #24553e;border-radius:14px;padding:10px;display:flex;justify-content:center}.canvasbox canvas{display:block;width:min(100%,540px);height:auto;border-radius:8px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.action{flex:1;min-width:120px;background:linear-gradient(#20e85d,#087a31);color:white}.action.secondary{background:linear-gradient(#6b39e8,#3b1c9b)}.action.dark{background:#1a2a24;border:1px solid #47665a}.hint{color:#89a99a;font-size:12px;line-height:1.5;margin-top:12px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.wrap{padding:20px 12px 32px}.preview{padding:12px}.controls{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="head"><div class="brand">♛ WINGO IMAGE STUDIO</div><div class="sub">Create your premium Wingo 1 MIN poster instantly</div></header>
<main class="layout">
<section class="panel">
<h2>✦ Create Bet Image</h2>
<div class="controls">
<div class="field"><label for="period">Period Number</label><input id="period" type="text" inputmode="numeric" maxlength="24" value="10270" placeholder="Enter period number"></div>
<div class="field"><label>Bet On</label><div class="choices"><button class="choice active" data-bet="BIG">▲ &nbsp; BIG</button><button class="choice" data-bet="SMALL">▼ &nbsp; SMALL</button></div></div>
<div class="field"><label for="frame">Time Frame</label><select id="frame"><option>1 MIN</option><option>30 SEC</option><option>3 MIN</option><option>5 MIN</option></select></div>
<div class="field"><label>Theme Color</label><div class="themes">
<button class="swatch active" data-theme="green" aria-label="Green" style="background:linear-gradient(135deg,#37ff70,#006c2b)"></button>
<button class="swatch" data-theme="blue" aria-label="Blue" style="background:linear-gradient(135deg,#39c9ff,#0750a7)"></button>
<button class="swatch" data-theme="red" aria-label="Red" style="background:linear-gradient(135deg,#ff596b,#9b0922)"></button>
<button class="swatch" data-theme="purple" aria-label="Purple" style="background:linear-gradient(135deg,#c17aff,#5420a8)"></button>
<button class="swatch" data-theme="gold" aria-label="Gold" style="background:linear-gradient(135deg,#ffe36b,#b66a00)"></button>
</div></div>
<button class="generate" id="generate">✧ &nbsp; GENERATE IMAGE</button>
<div class="hint">Period number aur BIG / SMALL manually select karein. Preview har change par automatically update hota hai. Download Image se PNG save kar sakte hain.</div>
</div>
</section>
<section class="panel preview">
<div class="previewtop"><h2 style="padding:0;border:0">◉ &nbsp; Live Preview</h2><span class="status">● READY</span></div>
<div class="canvasbox"><canvas id="poster" width="1080" height="1350"></canvas></div>
<div class="actions"><button class="action" id="download">⬇ Download Image</button><button class="action secondary" id="share">↗ Share</button><button class="action dark" id="reset">↻ Reset</button></div>
</section>
</main>
</div>
<script>
const canvas=document.getElementById('poster'),ctx=canvas.getContext('2d');
const period=document.getElementById('period'),frame=document.getElementById('frame');
let bet='BIG',theme='green';
const palettes={green:{a:'#00ff65',b:'#08752e',glow:'#00ff78',gold:'#ffc52e'},blue:{a:'#3dd8ff',b:'#0753a8',glow:'#20bfff',gold:'#ffe17a'},red:{a:'#ff526c',b:'#8e102a',glow:'#ff345c',gold:'#ffd16b'},purple:{a:'#d08aff',b:'#5421a4',glow:'#b36aff',gold:'#ffe17a'},gold:{a:'#ffe36b',b:'#9b5b00',glow:'#ffcb35',gold:'#fff0a1'}};
function rounded(x,y,w,h,r,fill,stroke,lw=3){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function glowText(text,x,y,size,color,shadow=color,weight=900){ctx.save();ctx.font=`${weight} ${size}px Arial`;ctx.textAlign='center';ctx.shadowColor=shadow;ctx.shadowBlur=24;ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.restore()}
function draw(){
 const p=palettes[theme],W=1080,H=1350;ctx.clearRect(0,0,W,H);
 let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#020907');bg.addColorStop(.55,'#071b12');bg.addColorStop(1,'#010504');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const rad=ctx.createRadialGradient(540,600,40,540,600,650);rad.addColorStop(0,p.b+'88');rad.addColorStop(1,'#00000000');ctx.fillStyle=rad;ctx.fillRect(0,0,W,H);
 // market candles and ambient beams
 for(let i=0;i<17;i++){let x=35+i*64,up=(i%3!==0),y=250+(i*73%300);ctx.fillStyle=up?'#00e58b':'#ed3e4f';ctx.globalAlpha=.65;ctx.fillRect(x,y,25,up?70:90);ctx.fillRect(x+10,y-28,5,up?130:145);ctx.globalAlpha=1}
 ctx.strokeStyle=p.glow;ctx.globalAlpha=.18;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,790);ctx.lineTo(1080,790);ctx.stroke();ctx.globalAlpha=1;
 // header
 glowText('♛',540,115,88,p.gold,p.gold);glowText('WINGO',540,245,150,'#ffffff',p.glow,1000);
 let g=ctx.createLinearGradient(0,265,0,350);g.addColorStop(0,p.a);g.addColorStop(1,p.b);rounded(285,285,510,100,48,'#07140f',p.glow,5);glowText(frame.value,540,354,66,'#ffffff',p.glow,900);
 // period card
 rounded(105,465,870,330,48,'#04110c',p.glow,5);rounded(140,500,800,260,36,'#061b10',p.a,3);
 glowText('▦  PERIOD NUMBER :-',540,585,48,'#f4fff8',p.glow,800);
 glowText(period.value.trim()||'________',540,705,126,p.gold,p.gold,1000);
 // bet card
 rounded(105,850,870,350,48,'#04110c',p.glow,5);rounded(140,885,800,280,36,'#061b10',p.a,3);
 glowText('◎  BET ON :-',540,980,55,'#f4fff8',p.glow,800);
 let betFill=ctx.createLinearGradient(0,1010,0,1140);betFill.addColorStop(0,p.a);betFill.addColorStop(1,p.b);
 rounded(260,1010,560,145,32,betFill,'#baffc8',5);
 glowText(bet,540,1115,100,'#ffffff',p.glow,1000);
 // base ring
 ctx.save();ctx.shadowColor=p.glow;ctx.shadowBlur=35;ctx.strokeStyle=p.a;ctx.lineWidth=12;ctx.beginPath();ctx.ellipse(540,1260,420,45,0,0,Math.PI*2);ctx.stroke();ctx.restore();
 glowText('WINGO  •  PLAY RESPONSIBLY',540,1315,25,'#9db9a8','#000',700);
}
document.querySelectorAll('[data-bet]').forEach(b=>b.addEventListener('click',()=>{bet=b.dataset.bet;document.querySelectorAll('[data-bet]').forEach(x=>x.classList.toggle('active',x===b));draw()}));
document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b));draw()}));
period.addEventListener('input',draw);frame.addEventListener('change',draw);
document.getElementById('generate').addEventListener('click',draw);
document.getElementById('download').addEventListener('click',()=>{let a=document.createElement('a');a.download=`Wingo-${frame.value.replace(' ','-')}-${period.value||'poster'}.png`;a.href=canvas.toDataURL('image/png');a.click()});
document.getElementById('share').addEventListener('click',async()=>{canvas.toBlob(async blob=>{let file=new File([blob],'wingo-poster.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Wingo Bet Image'})}catch(e){}}else{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wingo-poster.png';a.click()}},'image/png')});
document.getElementById('reset').addEventListener('click',()=>{period.value='10270';frame.value='1 MIN';bet='BIG';theme='green';document.querySelectorAll('[data-bet]').forEach(x=>x.classList.toggle('active',x.dataset.bet===bet));document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x.dataset.theme===theme));draw()});
draw();
</script>
</body></html>
